[package]
name = "goldlab-replay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0"
arrow-array = "59.3.2"
clap = { version = "4.5", features = ["derive"] }
goldlab-market-core = { path = "../market-core" }
hex = "0.4"
parquet = { version = "59.3.2", features = ["arrow"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
goldlab-recorder = { path = "../recorder" }
tempfile = "3.23"

[lints]
workspace = true

